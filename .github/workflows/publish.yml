name: publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      recipes: ${{ steps.bump.outputs.recipes || steps.changed.outputs.recipes }}
      bumped: ${{ steps.bump.outputs.bumped }}
      failed: ${{ steps.bump.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
      - run: pixi run check
      - id: bump
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pixi run bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: changed
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pixi run changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@v7
        with:
          name: recipes
          path: recipes

  build:
    needs: plan
    if: needs.plan.outputs.recipes != '[]'
    name: ${{ matrix.recipe }} (${{ matrix.target.platform }})
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.plan.outputs.recipes) }}
        target:
          - { platform: linux-64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: osx-64, runner: macos-15-intel }
          - { platform: osx-arm64, runner: macos-15 }
          - { platform: win-64, runner: windows-2025 }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: recipes
          path: recipes
      - uses: prefix-dev/setup-pixi@v0.10.2
      - shell: bash
        run: pixi run build "recipes/$RECIPE"
        env:
          RECIPE: ${{ matrix.recipe }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.recipe }}-${{ matrix.target.platform }}
          path: output/${{ matrix.target.platform }}/*.conda

  publish:
    needs: [plan, build]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.recipes != '[]'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: recipes
          path: recipes
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: output
      - uses: prefix-dev/setup-pixi@v0.10.2
      - name: Diagnose prefix.dev authorization
        run: |
          claims() {
            python3 -c 'import base64, json, sys
          part = sys.argv[1].split(".")[1]
          print(json.dumps(json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4))), indent=1, sort_keys=True))' "$1"
          }
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=prefix.dev" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$oidc"
          echo "== GitHub OIDC token claims"
          claims "$oidc"

          mint=$(curl -sS -w '\n%{http_code}' -X POST https://prefix.dev/api/oidc/mint_token \
            -H 'Content-Type: application/json' -d "{\"token\":\"$oidc\"}")
          mint_status=${mint##*$'\n'}
          token=${mint%$'\n'*}
          echo "== mint_token answered $mint_status"
          if [ "$mint_status" != 200 ]; then
            echo "$token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "== minted token prefix: ${token%%.*}"
          echo "== minted token claims"
          claims "${token#pfx-jwt.}" || echo "minted token is not a JWT"

          printf 'theedstow upload probe, not a conda package\n' > probe.conda
          name=theedstow-upload-probe-0.0.0-0.conda
          printf 'X-File-Name: %s\nX-File-SHA256: %s\n' "$name" "$(sha256sum probe.conda | cut -d' ' -f1)" > part-headers.txt
          upload=$(curl -sS -w '\n%{http_code}' -X POST https://prefix.dev/api/v1/upload/theedstow \
            -H "Authorization: Bearer $token" \
            -F "file=@probe.conda;filename=$name;type=application/octet-stream;headers=@part-headers.txt")
          echo "== probe upload without attestation answered ${upload##*$'\n'}: ${upload%$'\n'*}"
      - run: pixi run upload -vvv
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: pixi run commit-bumps
        env:
          BUMPED: ${{ needs.plan.outputs.bumped }}

  report:
    needs: plan
    if: needs.plan.outputs.failed != '' && needs.plan.outputs.failed != '[]'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::could not bump $FAILED, see the plan job log"
          exit 1
        env:
          FAILED: ${{ needs.plan.outputs.failed }}
