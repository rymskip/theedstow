name: check-key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          trimmed=$(printf '%s' "$PREFIX_API_KEY" | tr -d '[:space:]')
          echo "length ${#PREFIX_API_KEY}, without whitespace ${#trimmed}, starts with '${PREFIX_API_KEY:0:4}'"
          response=$(curl -sS -w '\n%{http_code}' -X POST https://prefix.dev/api/graphql \
            -H "Authorization: Bearer $PREFIX_API_KEY" -H 'Content-Type: application/json' \
            -d '{"query":"query { viewer { login } }"}')
          echo "graphql viewer answered ${response##*$'\n'}: ${response%$'\n'*}"

          printf 'theedstow upload probe, not a conda package\n' > probe.conda
          name=theedstow-upload-probe-0.0.0-0.conda
          printf 'X-File-Name: %s\nX-File-SHA256: %s\n' "$name" "$(sha256sum probe.conda | cut -d' ' -f1)" > part-headers.txt
          upload=$(curl -sS -w '\n%{http_code}' -X POST https://prefix.dev/api/v1/upload/theedstow \
            -H "Authorization: Bearer $PREFIX_API_KEY" \
            -F "file=@probe.conda;filename=$name;type=application/octet-stream;headers=@part-headers.txt")
          echo "probe upload with the key answered ${upload##*$'\n'}: ${upload%$'\n'*}"

          graphql() {
            curl -sS -X POST https://prefix.dev/api/graphql \
              -H "Authorization: Bearer $PREFIX_API_KEY" -H 'Content-Type: application/json' -d "$1"
          }
          echo "== channel theedstow:"
          graphql '{"query":"query { channel(name: \"theedstow\") { name channelPath isPrimary isPublic baseUrl allowV3Uploads namespace { __typename } owner { __typename } } }"}'
          echo
          echo "== manage access:"
          graphql '{"query":"query { channelManageAccess(channelName: \"theedstow\") }"}'
          echo
          echo "== api keys (no key values):"
          graphql '{"query":"query { apiKeys { name accessMode packagePatterns createdAt expiresAt revokedAt lastUsedAt channel { name channelPath isPrimary isPublic baseUrl } } }"}'
          echo
