context:
  version: "1.21.1"
  build_number: 0

package:
  name: blosc
  version: ${{ version }}

source:
  url: https://github.com/Blosc/c-blosc/archive/v${{ version }}.tar.gz
  sha256: f387149eab24efa01c308e4cba0f59f64ccae57292ec9c794002232f7903b55b

build:
  number: ${{ build_number }}
  skip: win
  dynamic_linking:
    overlinking_behavior: error
  script:
    # LDFLAGS names $PREFIX/lib, which nothing has created in a package without host dependencies.
    - mkdir -p "$PREFIX/lib"
    # Only the built-in BloscLZ and LZ4 codecs, with no external libraries.
    # The project asks GCC for gnu99 only on x86; GCC's C23 default makes bool a keyword elsewhere.
    - cmake -S . -B build -G Ninja ${CMAKE_ARGS}
        -DBUILD_STATIC=OFF
        -DBUILD_TESTS=OFF
        -DBUILD_BENCHMARKS=OFF
        -DDEACTIVATE_ZLIB=ON
        -DDEACTIVATE_ZSTD=ON
        ${{ "-DCMAKE_C_STANDARD=99" if linux and aarch64 else "" }}
    - cmake --build build --parallel ${CPU_COUNT}
    - cmake --install build

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage("blosc", upper_bound="x.x") }}

tests:
  - package_contents:
      lib:
        - blosc
      include:
        - blosc.h
  - files:
      recipe:
        - test_codecs.py
    requirements:
      run:
        - python
    script:
      - python test_codecs.py

about:
  homepage: https://www.blosc.org
  repository: https://github.com/Blosc/c-blosc
  license: BSD-3-Clause
  license_file: LICENSES/BLOSC.txt
  summary: Blocking, shuffling and compression library with its built-in codecs
  description: |
    Blosc compresses binary data in blocks after a shuffle filter. This build
    has only its built-in BloscLZ and LZ4 codecs and links no external
    compression library.
