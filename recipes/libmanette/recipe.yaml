context:
  version: "0.2.13"
  build_number: 0

package:
  name: libmanette
  version: ${{ version }}

source:
  url: https://download.gnome.org/sources/libmanette/0.2/libmanette-${{ version }}.tar.xz
  sha256: 287cc2fde0de092919366af757d85e7b3a0248eb1b395344726e97955a77d8ae

build:
  number: ${{ build_number }}
  # It reads gamepads through Linux's evdev devices.
  skip: not linux
  dynamic_linking:
    overlinking_behavior: error
  script:
    # The library alone: no demos, tests, introspection or Vala bindings, and devices found by
    # watching /dev/input rather than through udev, which conda-forge has no gudev of.
    - meson setup build ${MESON_ARGS}
        -Ddemos=false
        -Dbuild-tests=false
        -Dintrospection=false
        -Dvapi=false
        -Dgudev=disabled
    - meson compile -C build
    - meson install -C build

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - meson
    - ninja
    - pkg-config
  host:
    - glib
    - libevdev
    - libhidapi
    # What gio's pkg-config file requires of the build.
    - zlib
  run_exports:
    - ${{ pin_subpackage("libmanette", upper_bound="x.x") }}

tests:
  - package_contents:
      lib:
        - manette-0.2
      include:
        - libmanette/libmanette.h
      files:
        - lib/pkgconfig/manette-0.2.pc
  - script:
      - test -e "$PREFIX/lib/libmanette-0.2.so.0"

about:
  homepage: https://gnome.pages.gitlab.gnome.org/libmanette/
  repository: https://gitlab.gnome.org/GNOME/libmanette
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: GObject library for gamepads
  description: |
    libmanette reads gamepads and maps their buttons and axes to a standard
    layout. WebKitGTK links it for the Gamepad API. This build finds devices
    without udev and leaves out introspection and the Vala bindings.

extra:
  # The 0.2 series, whose `libmanette-0.2.so.0` is what WebKitGTK links.
  latest_version_url: https://download.gnome.org/sources/libmanette/0.2/
  latest_version_pattern: LATEST-IS-(\d+\.\d+\.\d+)
  versions:
    url: https://download.gnome.org/sources/libmanette/0.2/
    pattern: libmanette-(\d+\.\d+\.\d+)\.tar\.xz
