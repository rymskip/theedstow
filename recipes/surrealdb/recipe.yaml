context:
  version: "3.3.3"
  build_number: 0
  download_url: https://download.surrealdb.com/v${{ version }}

package:
  name: surrealdb
  version: ${{ version }}

source:
  - if: target_platform == "linux-64"
    then:
      url: ${{ download_url }}/surreal-v${{ version }}.linux-amd64.tgz
      sha256: 8e40c516024ca40933d2fc0a7981095a9b140474da66082a9d9f5dab7e0bac99
  - if: target_platform == "linux-aarch64"
    then:
      url: ${{ download_url }}/surreal-v${{ version }}.linux-arm64.tgz
      sha256: 926d1c1ed6aa8d61c2b5d1a4c34231db5bb9d9deba9b385dda45caef86bb1601
  - if: target_platform == "osx-64"
    then:
      url: ${{ download_url }}/surreal-v${{ version }}.darwin-amd64.tgz
      sha256: 2eb40261eae4ab0223fff3260b44fc809073715f97b7ff531714c3db479ca3a2
  - if: target_platform == "osx-arm64"
    then:
      url: ${{ download_url }}/surreal-v${{ version }}.darwin-arm64.tgz
      sha256: e5151d7a03bf9cb0acd4773c81846305c8a617049b47c1f5a8f69582ac49f962
  - if: target_platform == "win-64"
    then:
      url: ${{ download_url }}/surreal-v${{ version }}.windows-amd64.exe
      sha256: 613e6c4810c4a980f1b1677f23673c312b6ab3ef4809b4dd62c9c3b5ff0b8af4
      file_name: surreal.exe
  - url: https://static.crates.io/crates/surrealdb/surrealdb-${{ version }}.crate
    sha256: 029e59d64d0d96cd0d645965f47ba6c40603b9dbb5fb7cdef0460aa49719cece
    target_directory: crate

build:
  number: ${{ build_number }}
  dynamic_linking:
    overlinking_behavior: error
    # Windows API sets are OS-provided, but the check does not resolve them.
    missing_dso_allowlist:
      - api-ms-win-core-*.dll
  script:
    # The crate ships the release's LICENSE; `.crate` is not auto-extracted.
    - tar -xzf crate/surrealdb-${{ version }}.crate --strip-components 1 surrealdb-${{ version }}/LICENSE
    - if: unix
      then:
        - mkdir -p "$PREFIX/bin"
        - install -m 755 surreal "$PREFIX/bin/surreal"
      else:
        - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
        - copy surreal.exe "%LIBRARY_BIN%\surreal.exe"

requirements:
  # The sysroot tells the linking check which libraries glibc provides, and
  # exports the __glibc floor the upstream binaries need.
  build:
    - if: linux
      then: ${{ stdlib('c') }}
  # The linking check matches other libraries only against host packages.
  host:
    - if: linux
      then:
        - libgcc
        - libstdcxx
  run:
    - if: linux
      then:
        - libgcc
        - libstdcxx
    - if: osx and x86_64
      then: __osx >=10.12
    - if: osx and arm64
      then: __osx >=11.0

tests:
  - package_contents:
      bin:
        - surreal
  - script:
      - if: unix
        then: surreal version | grep -Eq "^${{ version | replace('.', '\\.') }}[+ ]"
        else: surreal version | findstr /r /b /c:"${{ version | replace('.', '\\.') }}[+ ]"

about:
  homepage: https://surrealdb.com
  repository: https://github.com/surrealdb/surrealdb
  documentation: https://surrealdb.com/docs
  license: BUSL-1.1
  license_file: LICENSE
  summary: A scalable, distributed, collaborative, document-graph database for the realtime web.
  description: |
    The `surreal` server and command-line tool, repackaged from the official
    SurrealDB release binaries.

extra:
  latest_version_url: https://download.surrealdb.com/latest.txt
