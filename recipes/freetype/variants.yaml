c_stdlib:
  - if: osx
    then: macosx_deployment_target
  - if: linux
    then: sysroot
c_stdlib_version:
  - if: osx
    then: "11.0"
  - if: linux
    then: "2.17"
# conda-forge's own compilers. Newer libc++ drops transitive includes this release relies on.
c_compiler_version:
  - if: osx
    then: "21"
  - if: linux
    then: "15"
cxx_compiler_version:
  - if: osx
    then: "21"
  - if: linux
    then: "15"
