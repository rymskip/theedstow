context:
  version: "3.5.4"
  build_number: 0

package:
  name: manifold
  version: ${{ version }}

source:
  url: https://github.com/elalish/manifold/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ce2f8b7798409b9f07e092c0ec0524ed0806431e01aea4020b65d0e934ea9438

build:
  number: ${{ build_number }}
  skip: win
  dynamic_linking:
    overlinking_behavior: error
  script:
    # LDFLAGS already carries the prefix rpath; installing manifold's own rpath would duplicate it.
    - cmake -S . -B build -G Ninja ${CMAKE_ARGS}
        -DCMAKE_SKIP_INSTALL_RPATH=ON
        -DBUILD_SHARED_LIBS=ON
        -DMANIFOLD_PAR=ON
        -DMANIFOLD_CROSS_SECTION=OFF
        -DMANIFOLD_TEST=OFF
        -DMANIFOLD_DOWNLOADS=OFF
    - cmake --build build --parallel ${CPU_COUNT}
    - cmake --install build

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - tbb-devel
  run_exports:
    - ${{ pin_subpackage("manifold", upper_bound="x.x") }}

tests:
  - package_contents:
      lib:
        - manifold
      include:
        - manifold/manifold.h
      files:
        - lib/cmake/manifold/manifoldConfig.cmake

about:
  homepage: https://manifoldcad.org
  repository: https://github.com/elalish/manifold
  license: Apache-2.0
  license_file: LICENSE
  summary: Geometry library for fast, robust mesh Boolean operations
  description: |
    Manifold builds guaranteed-manifold meshes and performs fast, robust
    Boolean operations on them, with TBB-based parallelism.
